name: bailian-selfhosted

services:
  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: bailian-selfhosted-web:local
    ports:
      - "${BAILIAN_BIND_ADDRESS:-0.0.0.0}:${BAILIAN_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
