name: bailian-selfhosted

services:
  runtime:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: bailian-selfhosted-runtime:local
    environment:
      BAILIAN_ORIGIN: ${BAILIAN_ORIGIN:-http://localhost:8080}
      BAILIAN_SERVICE_BINDING_SECRET: ${BAILIAN_SERVICE_BINDING_SECRET:?set a 64-character hex secret in .env}
    volumes:
      - "${BAILIAN_DATA_PATH:-./data}:/data"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/readyz', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  pool-refiller:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: bailian-selfhosted-runtime:local
    command: ["python", "-m", "api.replenish_u1_pool", "--watch"]
    environment:
      LK_DATABASE_PATH: /data/learning-kernel.sqlite3
      U1_POOL_REFILL_INTERVAL_SECONDS: ${U1_POOL_REFILL_INTERVAL_SECONDS:-2}
    volumes:
      - "${BAILIAN_DATA_PATH:-./data}:/data"
    depends_on:
      runtime:
        condition: service_healthy
    restart: unless-stopped

  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: bailian-selfhosted-web:local
    ports:
      - "${BAILIAN_BIND_ADDRESS:-0.0.0.0}:${BAILIAN_PORT:-8080}:80"
    environment:
      BAILIAN_SERVICE_BINDING_SECRET: ${BAILIAN_SERVICE_BINDING_SECRET:?set a 64-character hex secret in .env}
    depends_on:
      runtime:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
